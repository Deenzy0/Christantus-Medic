<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Christantus Medical Consult</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/scene3d.css" />
</head>
<body class="scene3d-dense">

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="auth-section">
      <div class="auth-card card">
        <div class="auth-brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </div>
        <h1>Welcome back</h1>
        <p class="auth-sub">Log in to manage your orders and consultations.</p>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" required />
            <span class="form-error" id="email-error"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required />
            <span class="form-error" id="password-error"></span>
          </div>

            <div class="mt-2 text-center">
                <a href="forgot-password.html" style="font-size:0.85rem;color:var(--color-blue);font-weight:600;">
                    Forgot your password?
                </a>
             </div>

          <div id="login-alert" class="auth-alert hidden"></div>

          <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">
            <span class="btn-text">Log In</span>
          </button>
        </form>

        <p class="auth-footer-text">Don't have an account? <a href="register.html">Sign up</a></p>
        <!--<p class="auth-footer-text small">Admin demo: admin@christantusmedical.com / ChangeThisPassword123! <br/>(after running <span class="mono">npm run seed</span>)</p>-->
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/scene3d.js"></script>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
