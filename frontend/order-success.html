<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — Christantus Medical Consult</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/callback.css" />
  <link rel="stylesheet" href="css/order-detail.css" />
  <link rel="stylesheet" href="css/scene3d.css" />
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="callback-section" id="order-loading">
      <div class="callback-card card">
        <div class="spinner spinner-blue spinner-lg"></div>
        <h2>Loading your order...</h2>
      </div>
    </section>

    <section class="order-detail-section hidden" id="order-detail-section">
      <div class="container">
        <div class="order-success-banner">
          <div class="callback-icon success">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <h1>Order Confirmed!</h1>
          <p>Thank you — your order has been received. A confirmation has been logged to your dashboard.</p>
        </div>

        <div class="order-detail-card card" id="order-detail-card"></div>

        <div class="order-actions-row">
          <a href="dashboard.html" class="btn btn-outline">View All Orders</a>
          <a href="shop.html" class="btn btn-primary">Continue Shopping</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/scene3d.js"></script>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/order-success.js"></script>
</body>
</html>
