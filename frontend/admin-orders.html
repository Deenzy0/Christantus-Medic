<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Orders — Christantus Medical Consult</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/scene3d.css" />
</head>
<body class="admin-body scene3d-dense">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Orders</h1>
          <p>View and update the status of customer orders.</p>
        </div>
      </div>

      <div class="admin-table-card">
        <div class="admin-table-toolbar">
          <input type="text" id="order-search" class="form-input" placeholder="Search by order number or customer..." />
          <select id="order-status-filter" class="form-select">
            <option value="All">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="processing">Processing</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Order #</th>
                <th>Customer</th>
                <th>Date</th>
                <th>Items</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="orders-table-body">
              <tr><td colspan="8" class="text-center" style="padding:40px;">Loading...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="admin-pagination" id="orders-pagination"></div>
      </div>
    </main>
  </div>

  <!-- Order Detail Modal -->
  <div class="modal-overlay hidden" id="order-modal-overlay">
    <div class="modal-box" style="max-width:620px;">
      <div class="modal-header">
        <h3 id="order-modal-title">Order Details</h3>
        <button class="modal-close" id="order-modal-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
      <div id="order-modal-body"></div>
    </div>
  </div>
  <script src="js/scene3d.js"></script>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/admin-layout.js"></script>
  <script src="js/admin-orders.js"></script>
</body>
</html>
