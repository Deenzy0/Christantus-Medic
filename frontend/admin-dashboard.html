<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Christantus Medical Consult</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/scene3d.css" />
</head>
<body class="admin-body scene3d-dense">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Dashboard</h1>
          <p>Welcome back. Here's what's happening with your store today.</p>
        </div>
      </div>

      <div class="stats-grid" id="stats-grid">
        <!-- populated by JS -->
      </div>

      <div class="admin-table-card">
        <div class="admin-table-toolbar">
          <h3 style="font-size:1rem;">Recent Orders</h3>
          <a href="admin-orders.html" class="btn btn-outline btn-sm">View all orders</a>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Order #</th>
                <th>Customer</th>
                <th>Date</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="recent-orders-body">
              <tr><td colspan="6" class="text-center" style="padding:40px;">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="js/scene3d.js"></script>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/admin-layout.js"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
