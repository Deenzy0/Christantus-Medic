<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Christantus Medical Consult</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/scene3d.css" />
</head>
<body class="scene3d-dense">

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="auth-section">
      <div class="auth-card card">
        <div class="auth-brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </div>
        <h1>Create your account</h1>
        <p class="auth-sub">Sign up to order products and book consultations.</p>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" id="name" class="form-input" placeholder="Jane Okafor" required />
            <span class="form-error" id="name-error"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" required />
            <span class="form-error" id="email-error"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-input" placeholder="0803 123 4567" />
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required minlength="6" />
            <span class="form-error" id="password-error"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-input" placeholder="Re-enter your password" required minlength="6" />
            <span class="form-error" id="confirm-password-error"></span>
          </div>

          <div id="register-alert" class="auth-alert hidden"></div>

          <button type="submit" class="btn btn-primary btn-block" id="register-submit-btn">
            <span class="btn-text">Create Account</span>
          </button>
        </form>

        <p class="auth-footer-text">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/scene3d.js"></script>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
