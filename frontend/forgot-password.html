<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Christantus Medical Consult</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/scene3d.css" />
</head>
<body class="scene3d-dense">

  <header class="site-header" id="site-header"></header>

  <main class="auth-page">
    <div class="auth-card card">
      <div class="auth-header">
        <h1>Forgot your password?</h1>
        <p>Enter your email address and we'll send you a link to reset it.</p>
      </div>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="your@email.com" required />
        </div>

        <div id="forgot-alert" class="auth-alert hidden"></div>
        <div id="forgot-success" class="auth-alert success hidden"></div>

        <button type="submit" class="btn btn-primary btn-block" id="forgot-btn">
          <span class="btn-text">Send Reset Link</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Remember your password? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/scene3d.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
