<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Christantus Medical Consult</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/scene3d.css" />
</head>
<body class="scene3d-dense">

  <header class="site-header" id="site-header"></header>

  <main class="auth-page">
    <div class="auth-card card">

      <div id="reset-form-section">
        <div class="auth-header">
          <h1>Set a new password</h1>
          <p>Choose a strong password — at least 6 characters.</p>
        </div>

        <form id="reset-form">
          <div class="form-group">
            <label class="form-label" for="newPassword">New Password</label>
            <input type="password" id="newPassword" class="form-input" placeholder="At least 6 characters" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" class="form-input" placeholder="Repeat your new password" required />
          </div>

          <div id="reset-alert" class="auth-alert hidden"></div>

          <button type="submit" class="btn btn-primary btn-block" id="reset-btn">
            <span class="btn-text">Reset Password</span>
          </button>
        </form>
      </div>

      <div id="reset-success" class="hidden text-center">
        <div style="width:64px;height:64px;background:var(--color-green-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--color-green-dark)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <h2 style="margin-bottom:8px;">Password Reset!</h2>
        <p style="margin-bottom:24px;">Your password has been changed. You're being logged in...</p>
      </div>

      <div id="reset-expired" class="hidden text-center">
        <div style="width:64px;height:64px;background:#FDE8ED;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--color-red)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        </div>
        <h2 style="margin-bottom:8px;">Link Expired</h2>
        <p style="margin-bottom:24px;">This reset link is invalid or has expired.</p>
        <a href="forgot-password.html" class="btn btn-primary btn-block">Request a New Link</a>
      </div>

    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/scene3d.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
